name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer le build manuellement

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }} # Nécessaire pour build sur EAS servers

      - name: Install dependencies
        run: npm ci

      - name: Build APK (Local runner)
        # Utilisation de --local pour compiler directement sur le runner GitHub Actions (gratuit, pas besoin d'abonnement EAS)
        # Note : Si vous préférez utiliser les serveurs EAS, remplacez par : eas build -p android --profile preview --non-interactive
        run: eas build -p android --profile preview --local --non-interactive

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homeweather-apk
          path: build/*.apk
